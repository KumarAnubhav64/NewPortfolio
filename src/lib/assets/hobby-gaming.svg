<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#F4F5F7"/>

  <!-- Left panel: controller -->
  <rect x="24" y="24" width="360" height="452" rx="16" fill="#FFFFFF" stroke="#D7D9DE" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>
  <rect x="24" y="24" width="360" height="52" rx="16" fill="#FFFFFF"/>
  <rect x="44" y="44" width="100" height="8" rx="4" fill="#1E2430" opacity="0.7"/>
  <circle cx="330" cy="50" r="6" fill="#34C749"/>

  <!-- Controller body -->
  <rect x="64" y="130" width="280" height="150" rx="60" fill="#FBFCFD" stroke="#1E2430" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Grips -->
  <path d="M84 250c-14 34 6 62 40 62 26 0 40-16 40-34v-34" fill="#FBFCFD" stroke="#1E2430" stroke-width="2.5" stroke-opacity="0.8"/>
  <path d="M324 250c14 34-6 62-40 62-26 0-40-16-40-34v-34" fill="#FBFCFD" stroke="#1E2430" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- D-pad -->
  <g fill="#1E2430" opacity="0.75">
    <rect x="104" y="172" width="14" height="44" rx="4"/>
    <rect x="96" y="180" width="30" height="14" rx="4"/>
  </g>
  <!-- Left stick -->
  <circle cx="176" cy="242" r="20" fill="#5C7095" opacity="0.15"/>
  <circle cx="176" cy="242" r="10" fill="#5C7095" opacity="0.6"/>

  <!-- Action buttons -->
  <circle cx="276" cy="172" r="11" fill="#5C7095" opacity="0.15"/>
  <text x="276" y="177" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#5C7095">X</text>
  <circle cx="276" cy="214" r="11" fill="#34C749" opacity="0.18"/>
  <text x="276" y="219" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#34C749" opacity="0.9">B</text>
  <circle cx="254" cy="192" r="11" fill="#D7D9DE"/>
  <text x="254" y="197" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#5B6270">Y</text>
  <circle cx="298" cy="192" r="11" fill="#D7D9DE"/>
  <text x="298" y="197" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#5B6270">A</text>

  <!-- Right stick -->
  <circle cx="256" cy="268" r="20" fill="#5C7095" opacity="0.15"/>
  <circle cx="256" cy="268" r="10" fill="#5C7095" opacity="0.6"/>

  <!-- Start / select -->
  <rect x="216" y="196" width="12" height="6" rx="3" fill="#1E2430" opacity="0.5"/>
  <rect x="232" y="196" width="12" height="6" rx="3" fill="#1E2430" opacity="0.5"/>

  <!-- Signal arcs from antenna-less controller -->
  <path d="M120 356c10 12 24 18 40 18M310 356c-10 12-24 18-40 18" stroke="#5C7095" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Button labels under controller -->
  <rect x="120" y="396" width="120" height="7" rx="3.5" fill="#C8CBD0"/>
  <rect x="140" y="410" width="80" height="5" rx="2.5" fill="#C8CBD0" opacity="0.5"/>

  <!-- Right panel: HUD -->
  <rect x="408" y="24" width="368" height="452" rx="16" fill="#FFFFFF" stroke="#D7D9DE" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>
  <rect x="432" y="44" width="130" height="9" rx="4.5" fill="#1E2430" opacity="0.7"/>
  <rect x="432" y="60" width="150" height="6" rx="3" fill="#C8CBD0"/>

  <!-- Health bar -->
  <rect x="432" y="88" width="320" height="18" rx="9" fill="#EAEBEE"/>
  <rect x="432" y="88" width="252" height="18" rx="9" fill="#34C749" opacity="0.85"/>
  <rect x="600" y="88" width="8" height="18" rx="4" fill="#FFFFFF"/>
  <text x="760" y="102" text-anchor="end" font-family="'Inter',sans-serif" font-size="14" font-weight="600" fill="#1E2430" opacity="0.7">84%</text>

  <!-- Ammo -->
  <rect x="432" y="120" width="64" height="30" rx="8" fill="#F0F2F6"/>
  <rect x="442" y="128" width="6" height="14" rx="2" fill="#5C7095"/>
  <rect x="454" y="124" width="6" height="22" rx="2" fill="#5C7095" opacity="0.7"/>
  <rect x="466" y="120" width="6" height="30" rx="2" fill="#5C7095" opacity="0.5"/>
  <rect x="478" y="126" width="6" height="18" rx="2" fill="#D7D9DE"/>
  <text x="512" y="141" font-family="'Inter',sans-serif" font-size="14" font-weight="600" fill="#5B6270">27</text>

  <!-- Minimap -->
  <rect x="432" y="164" width="120" height="120" rx="10" fill="#F0F2F6" stroke="#D7D9DE" stroke-width="1"/>
  <path d="M492 164v120M432 224h120" stroke="#D7D9DE" stroke-width="1"/>
  <path d="M456 244a42 42 0 0 1 42-42" stroke="#5C7095" stroke-width="1.6" stroke-opacity="0.7" fill="none"/>
  <circle cx="498" cy="202" r="5" fill="#FC5F5F" opacity="0.85"/>
  <circle cx="470" cy="250" r="3" fill="#5C7095" opacity="0.5"/>
  <circle cx="520" cy="236" r="3" fill="#5C7095" opacity="0.5"/>
  <rect x="432" y="160" width="26" height="7" rx="3.5" fill="#C8CBD0"/>

  <!-- Crosshair -->
  <g stroke="#1E2430" stroke-width="2" stroke-opacity="0.55">
    <line x1="604" y1="200" x2="604" y2="212"/>
    <line x1="604" y1="236" x2="604" y2="248"/>
    <line x1="592" y1="224" x2="604" y2="224"/>
    <line x1="604" y1="224" x2="616" y2="224"/>
  </g>
  <circle cx="604" cy="224" r="3" fill="#FC5F5F" opacity="0.8"/>

  <!-- Score -->
  <rect x="432" y="308" width="70" height="7" rx="3.5" fill="#C8CBD0"/>
  <text x="432" y="352" font-family="'Fraunces',serif" font-size="40" fill="#1E2430" opacity="0.85">12,480</text>
  <rect x="432" y="366" width="120" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="700" y="352" width="30" height="5" rx="2.5" fill="#34C749" opacity="0.8"/>

  <!-- FPS + PRESS START -->
  <rect x="432" y="396" width="90" height="24" rx="12" fill="#34C749" opacity="0.12"/>
  <text x="446" y="413" font-family="'Inter',sans-serif" font-size="13" font-weight="600" fill="#34C749" opacity="0.9">144 FPS</text>

  <rect x="560" y="392" width="150" height="32" rx="16" stroke="#5C7095" stroke-width="1.5" stroke-dasharray="6 5" fill="#FBFCFD"/>
  <text x="635" y="413" text-anchor="middle" font-family="'Inter',sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5C7095">PRESS START</text>
</svg>
