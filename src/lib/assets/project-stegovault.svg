<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#F6F1E8"/>

  <!-- Left: cover image (pixel-grid landscape) -->
  <rect x="24" y="24" width="360" height="452" rx="16" fill="#FFFFFF" stroke="#DDD5C8" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>

  <!-- Image top bar -->
  <rect x="24" y="24" width="360" height="48" rx="16" fill="#FFFFFF"/>
  <rect x="44" y="42" width="80" height="8" rx="4" fill="#2A2622" opacity="0.6"/>
  <rect x="320" y="40" width="44" height="16" rx="8" fill="#5C6F95" opacity="0.12"/>
  <rect x="330" y="46" width="24" height="4" rx="2" fill="#5C6F95" opacity="0.6"/>

  <!-- Pixel grid image (sky) -->
  <rect x="44" y="88" width="320" height="140" fill="#F3EEE5"/>
  <rect x="44" y="88" width="160" height="48" fill="#DDE3EC"/>
  <rect x="204" y="88" width="160" height="48" fill="#E3E8F0"/>
  <rect x="44" y="136" width="80" height="40" fill="#E3E8F0"/>
  <rect x="124" y="136" width="100" height="40" fill="#DDE3EC"/>
  <rect x="224" y="136" width="140" height="40" fill="#E3E8F0"/>

  <!-- Sun pixel -->
  <rect x="300" y="100" width="16" height="16" rx="2" fill="#FDBC40" opacity="0.85"/>

  <!-- Mountain pixels -->
  <rect x="44" y="176" width="40" height="52" fill="#B9C3D4"/>
  <rect x="84" y="196" width="40" height="32" fill="#A9B4C7"/>
  <rect x="124" y="176" width="40" height="52" fill="#B9C3D4"/>
  <rect x="164" y="196" width="40" height="32" fill="#A9B4C7"/>
  <rect x="204" y="176" width="40" height="52" fill="#B9C3D4"/>
  <rect x="244" y="196" width="40" height="32" fill="#A9B4C7"/>
  <rect x="284" y="176" width="40" height="52" fill="#B9C3D4"/>
  <rect x="324" y="196" width="40" height="32" fill="#A9B4C7"/>

  <!-- Pixel grid overlay -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.25">
    <line x1="104" y1="88" x2="104" y2="228"/>
    <line x1="164" y1="88" x2="164" y2="228"/>
    <line x1="224" y1="88" x2="224" y2="228"/>
    <line x1="284" y1="88" x2="284" y2="228"/>
    <line x1="44" y1="136" x2="364" y2="136"/>
    <line x1="44" y1="176" x2="364" y2="176"/>
  </g>

  <!-- Embedded lock (the secret) -->
  <rect x="150" y="118" width="26" height="20" rx="4" fill="#FC5F5F" opacity="0.9"/>
  <path d="M157 118 v-5 a6 6 0 0 1 12 0 v5" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <rect x="158" y="126" width="10" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Caption -->
  <rect x="44" y="244" width="180" height="7" rx="3.5" fill="#C8CBD0"/>
  <rect x="44" y="258" width="260" height="6" rx="3" fill="#C8CBD0" opacity="0.5"/>

  <!-- AI sparkles -->
  <path d="M120 262 l3 -6 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 z" fill="#7D4698" opacity="0.35"/>
  <path d="M310 252 l2.5 -5 l2.5 5 l5 2.5 l-5 2.5 l-2.5 5 l-2.5 -5 l-5 -2.5 z" fill="#7D4698" opacity="0.25"/>

  <!-- Stego dot markers -->
  <circle cx="60" cy="104" r="3" fill="#34C749" opacity="0.6"/>
  <circle cx="340" cy="210" r="3" fill="#34C749" opacity="0.6"/>
  <circle cx="240" cy="120" r="3" fill="#34C749" opacity="0.6"/>

  <!-- Right: decode pipeline -->
  <rect x="408" y="24" width="368" height="452" rx="16" fill="#FFFFFF" stroke="#DDD5C8" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>
  <rect x="432" y="44" width="130" height="9" rx="4.5" fill="#2A2622" opacity="0.7"/>
  <rect x="432" y="60" width="170" height="6" rx="3" fill="#C8CBD0"/>

  <!-- Step 1: Extract LSB -->
  <rect x="432" y="92" width="320" height="64" rx="12" fill="#FFFFFF" stroke="#DDD5C8" stroke-width="1"/>
  <rect x="448" y="108" width="90" height="7" rx="3.5" fill="#2A2622" opacity="0.55"/>
  <rect x="448" y="124" width="200" height="6" rx="3" fill="#C8CBD0"/>

  <!-- Binary bits -->
  <rect x="448" y="138" width="16" height="6" rx="3" fill="#34C749" opacity="0.7"/>
  <rect x="470" y="138" width="16" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="492" y="138" width="16" height="6" rx="3" fill="#34C749" opacity="0.4"/>
  <rect x="514" y="138" width="16" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="536" y="138" width="16" height="6" rx="3" fill="#34C749" opacity="0.7"/>
  <rect x="558" y="138" width="16" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="580" y="138" width="16" height="6" rx="3" fill="#34C749" opacity="0.4"/>
  <rect x="602" y="138" width="16" height="6" rx="3" fill="#C8CBD0"/>

  <!-- Arrow -->
  <line x1="592" y1="156" x2="592" y2="184" stroke="#DDD5C8" stroke-width="1.5"/>
  <polygon points="588,180 592,190 596,180" fill="#DDD5C8"/>

  <!-- Step 2: AES decrypt -->
  <rect x="432" y="190" width="320" height="64" rx="12" fill="#FFFFFF" stroke="#DDD5C8" stroke-width="1"/>
  <rect x="448" y="206" width="110" height="7" rx="3.5" fill="#2A2622" opacity="0.55"/>
  <rect x="448" y="222" width="180" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="448" y="236" width="14" height="12" rx="3" fill="#34C749" opacity="0.6"/>
  <path d="M451 236 v-3 a4 4 0 0 1 8 0 v3" stroke="#34C749" stroke-width="1.5" fill="none"/>
  <rect x="470" y="234" width="40" height="6" rx="3" fill="#C8CBD0" opacity="0.6"/>

  <!-- Arrow -->
  <line x1="592" y1="254" x2="592" y2="282" stroke="#DDD5C8" stroke-width="1.5"/>
  <polygon points="588,278 592,288 596,278" fill="#DDD5C8"/>

  <!-- Step 3: Vault unlocked -->
  <rect x="432" y="288" width="320" height="140" rx="12" fill="#F0F2F6"/>
  <rect x="448" y="304" width="120" height="8" rx="4" fill="#2A2622" opacity="0.6"/>
  <circle cx="476" cy="336" r="10" fill="#34C749" opacity="0.2"/>
  <path d="M472 336 l3 3 l6 -7" stroke="#34C749" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Password rows -->
  <rect x="448" y="356" width="280" height="22" rx="6" fill="#FFFFFF" stroke="#F3EEE5" stroke-width="1"/>
  <circle cx="464" cy="367" r="4" fill="#5C6F95" opacity="0.5"/>
  <rect x="476" y="363" width="80" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="640" y="363" width="60" height="6" rx="3" fill="#C8CBD0" opacity="0.4"/>

  <rect x="448" y="384" width="280" height="22" rx="6" fill="#FFFFFF" stroke="#F3EEE5" stroke-width="1"/>
  <circle cx="464" cy="395" r="4" fill="#5C6F95" opacity="0.5"/>
  <rect x="476" y="391" width="100" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="640" y="391" width="50" height="6" rx="3" fill="#C8CBD0" opacity="0.4"/>

  <rect x="448" y="412" width="280" height="10" rx="5" fill="none"/>

  <!-- Summary badge -->
  <rect x="432" y="444" width="180" height="10" rx="5" fill="#34C749" opacity="0.15"/>
</svg>
