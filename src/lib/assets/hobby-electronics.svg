<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#F4F5F7"/>

  <!-- Left panel: PCB -->
  <rect x="24" y="24" width="360" height="452" rx="16" fill="#FFFFFF" stroke="#D7D9DE" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>
  <rect x="24" y="24" width="360" height="52" rx="16" fill="#FFFFFF"/>
  <rect x="44" y="44" width="120" height="8" rx="4" fill="#1E2430" opacity="0.7"/>
  <circle cx="330" cy="50" r="6" fill="#34C749"/>

  <!-- Board -->
  <rect x="44" y="92" width="320" height="284" rx="12" fill="#F0F2F6" stroke="#D7D9DE" stroke-width="1"/>

  <!-- Traces -->
  <g stroke="#5C7095" stroke-width="2" stroke-opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M120 180h70v40h60"/>
    <path d="M250 150h40v70h36"/>
    <path d="M120 260h90v-30h56"/>
    <path d="M300 220v60h-46"/>
    <path d="M180 260v46h30"/>
  </g>

  <!-- Chip 1 -->
  <rect x="84" y="140" width="72" height="72" rx="8" fill="#1E2430" opacity="0.85"/>
  <circle cx="96" cy="152" r="4" fill="#FFFFFF" opacity="0.6"/>
  <rect x="104" y="158" width="36" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
  <rect x="104" y="172" width="26" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <g fill="#5C7095">
    <rect x="72" y="148" width="10" height="5" rx="2"/>
    <rect x="72" y="162" width="10" height="5" rx="2"/>
    <rect x="72" y="176" width="10" height="5" rx="2"/>
    <rect x="72" y="190" width="10" height="5" rx="2"/>
    <rect x="158" y="148" width="10" height="5" rx="2"/>
    <rect x="158" y="162" width="10" height="5" rx="2"/>
    <rect x="158" y="176" width="10" height="5" rx="2"/>
    <rect x="158" y="190" width="10" height="5" rx="2"/>
    <rect x="92" y="128" width="5" height="10" rx="2"/>
    <rect x="106" y="128" width="5" height="10" rx="2"/>
    <rect x="120" y="128" width="5" height="10" rx="2"/>
    <rect x="134" y="128" width="5" height="10" rx="2"/>
    <rect x="92" y="214" width="5" height="10" rx="2"/>
    <rect x="106" y="214" width="5" height="10" rx="2"/>
    <rect x="120" y="214" width="5" height="10" rx="2"/>
    <rect x="134" y="214" width="5" height="10" rx="2"/>
  </g>

  <!-- Resistor zigzag -->
  <polyline points="216,150 226,138 236,162 246,138 256,162 266,138 276,150" stroke="#1E2430" stroke-width="2" stroke-opacity="0.6" fill="none" stroke-linejoin="round"/>
  <line x1="196" y1="150" x2="216" y2="150" stroke="#1E2430" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="276" y1="150" x2="296" y2="150" stroke="#1E2430" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Gold pads -->
  <g fill="#E8B54A" opacity="0.85">
    <circle cx="250" cy="252" r="6"/>
    <circle cx="292" cy="252" r="6"/>
    <circle cx="250" cy="292" r="6"/>
    <circle cx="292" cy="292" r="6"/>
    <circle cx="180" cy="252" r="6"/>
    <circle cx="180" cy="292" r="6"/>
  </g>

  <!-- Chip 2 (small) -->
  <rect x="300" y="180" width="44" height="34" rx="6" fill="#5C7095" opacity="0.2"/>
  <circle cx="312" cy="194" r="4" fill="#34C749" opacity="0.9"/>

  <!-- USB port -->
  <rect x="286" y="330" width="36" height="20" rx="4" fill="#FBFCFD" stroke="#1E2430" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="296" y="336" width="16" height="8" rx="2" fill="#1E2430" opacity="0.5"/>

  <!-- Capacitor -->
  <circle cx="120" cy="330" r="10" fill="#FBFCFD" stroke="#5C7095" stroke-width="2"/>
  <line x1="110" y1="330" x2="130" y2="330" stroke="#5C7095" stroke-width="1.5"/>
  <line x1="120" y1="320" x2="120" y2="340" stroke="#5C7095" stroke-width="1.5"/>

  <rect x="120" y="396" width="160" height="7" rx="3.5" fill="#C8CBD0"/>
  <rect x="140" y="410" width="120" height="5" rx="2.5" fill="#C8CBD0" opacity="0.5"/>

  <!-- Right panel: tools -->
  <rect x="408" y="24" width="368" height="452" rx="16" fill="#FFFFFF" stroke="#D7D9DE" stroke-width="1" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.04))"/>
  <rect x="432" y="44" width="130" height="9" rx="4.5" fill="#1E2430" opacity="0.7"/>
  <rect x="432" y="60" width="150" height="6" rx="3" fill="#C8CBD0"/>

  <!-- Soldering iron -->
  <g>
    <path d="M470 120l-70 70 22 22 70-70z" fill="#FBFCFD" stroke="#1E2430" stroke-width="2" stroke-opacity="0.8"/>
    <rect x="470" y="96" width="26" height="70" rx="8" fill="#1E2430" opacity="0.85"/>
    <rect x="476" y="104" width="14" height="12" rx="3" fill="#34C749" opacity="0.8"/>
    <!-- Tip + spark -->
    <path d="M394 196l16 16" stroke="#C8CBD0" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#FDBC40" stroke-width="2" stroke-linecap="round">
      <line x1="392" y1="184" x2="386" y2="176"/>
      <line x1="404" y1="188" x2="412" y2="182"/>
      <line x1="404" y1="206" x2="412" y2="212"/>
    </g>
    <circle cx="392" cy="196" r="3" fill="#FDBC40"/>
  </g>

  <!-- Multimeter -->
  <rect x="508" y="152" width="120" height="150" rx="12" fill="#FBFCFD" stroke="#1E2430" stroke-width="2.2" stroke-opacity="0.8"/>
  <rect x="522" y="166" width="92" height="44" rx="8" fill="#F0F2F6" stroke="#D7D9DE" stroke-width="1"/>
  <rect x="534" y="176" width="60" height="6" rx="3" fill="#1E2430" opacity="0.6"/>
  <rect x="534" y="190" width="44" height="5" rx="2.5" fill="#C8CBD0"/>
  <text x="522" y="238" font-family="'Inter',sans-serif" font-size="15" fill="#1E2430" opacity="0.75">12.4 V</text>
  <!-- Dial -->
  <circle cx="568" cy="268" r="14" fill="#EAEBEE"/>
  <line x1="568" y1="268" x2="578" y2="262" stroke="#5C7095" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Leads -->
  <path d="M508 168c-20 6-26 30-8 44" stroke="#FC5F5F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M628 168c20 6 26 30 8 44" stroke="#5C7095" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Battery -->
  <rect x="672" y="160" width="76" height="34" rx="8" fill="#FBFCFD" stroke="#1E2430" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="712" y="152" width="10" height="10" rx="3" fill="#1E2430" opacity="0.7"/>
  <rect x="682" y="170" width="52" height="5" rx="2.5" fill="#34C749" opacity="0.9"/>
  <rect x="682" y="181" width="38" height="5" rx="2.5" fill="#34C749" opacity="0.5"/>

  <!-- FIXED chip -->
  <rect x="508" y="330" width="140" height="28" rx="14" fill="#34C749" opacity="0.12"/>
  <path d="M524 344l8 8 14-16" stroke="#34C749" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <text x="550" y="349" font-family="'Inter',sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#34C749" opacity="0.9">FIXED</text>

  <!-- Revived board -->
  <rect x="508" y="376" width="180" height="64" rx="10" fill="#F0F2F6" stroke="#D7D9DE" stroke-width="1"/>
  <g fill="#5C7095" opacity="0.6">
    <rect x="524" y="392" width="12" height="12" rx="3"/>
    <rect x="544" y="392" width="12" height="12" rx="3"/>
    <rect x="524" y="412" width="12" height="12" rx="3"/>
  </g>
  <rect x="580" y="392" width="50" height="6" rx="3" fill="#C8CBD0"/>
  <rect x="580" y="406" width="70" height="6" rx="3" fill="#C8CBD0" opacity="0.5"/>
  <path d="M668 398l10 8-18 12" stroke="#34C749" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <rect x="432" y="380" width="60" height="7" rx="3.5" fill="#C8CBD0"/>
</svg>
