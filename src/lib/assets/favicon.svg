<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #1E2430; }
      .letter { fill: #FFFFFF; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FFFFFF; }
      .letter { fill: #1E2430; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <text class="letter" x="16" y="21" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" letter-spacing="0.5">KA</text>
</svg>
